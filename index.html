<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101419"><meta name="description" content="在浏览器中旋转、缩放并欣赏皮卡丘 3D 模型。">
<title>皮卡丘 · 3D 模型展厅</title>
<script type="module" src="assets/model-viewer.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#101419;color:#f5f4ed;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}header{height:88px;display:flex;align-items:center;justify-content:space-between;max-width:1440px;margin:auto;padding:0 5vw;border-bottom:1px solid #ffffff12}.brand{font-size:17px;font-weight:700;letter-spacing:1px}.brand span{color:#ffd859;font-size:26px;margin-right:12px}.tag{color:#9da6af;font-size:12px;letter-spacing:2px}main{max-width:1440px;margin:auto;padding:48px 5vw 36px}.layout{display:grid;grid-template-columns:320px 1fr;gap:48px;align-items:center;min-height:660px}.eyebrow{font-size:12px;color:#ffd859;letter-spacing:3px}h1{font-size:64px;letter-spacing:-3px;margin:22px 0 5px;line-height:1.1}.english{font-size:16px;color:#8f99a6;letter-spacing:5px;margin:0 0 32px}.desc{font-size:15px;line-height:1.9;color:#adb6c1;max-width:310px}.chip{display:inline-flex;border:1px solid #ffd85944;border-radius:30px;padding:8px 15px;color:#ffd859;font-size:12px;margin-top:20px}.stage{position:relative;border:1px solid #ffffff0e;border-radius:28px;background:radial-gradient(ellipse at 50% 45%,#304759 0%,#1a252f 52%,#171e25 100%);overflow:hidden;height:660px}model-viewer{width:100%;height:100%;--poster-color:transparent;--progress-bar-color:#ffd859}model-viewer::part(default-progress-bar){height:3px}.stage-label{position:absolute;left:25px;top:24px;font-size:11px;letter-spacing:2px;color:#bac6d2;pointer-events:none}.hint{position:absolute;left:0;right:0;bottom:23px;text-align:center;color:#b6c3d0;font-size:12px;pointer-events:none}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}button,.download{border:1px solid #ffffff20;background:#ffffff07;color:#f5f4ed;font:inherit;font-size:13px;border-radius:12px;padding:13px 16px;cursor:pointer;text-decoration:none}button:hover,.download:hover{border-color:#ffd859;color:#ffd859}button.active{background:#ffd859;color:#171e25;border-color:#ffd859}.secondary{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.download{font-size:12px;padding:11px 14px;color:#aeb8c5}.meta{display:flex;gap:32px;border-top:1px solid #ffffff12;margin-top:45px;padding-top:24px}.meta div{font-size:12px;color:#8895a4}.meta strong{display:block;color:#e4e7e9;font-weight:500;margin-top:8px;font-size:14px}footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #ffffff12;padding-top:22px;margin-top:36px;font-size:12px;color:#74808d}.status{position:absolute;top:48px;left:25px;right:25px;font-size:12px;color:#ffd859}.error{background:#18242fe8;padding:16px;border-radius:12px;line-height:1.7}@media(max-width:850px){header{height:72px}.tag{font-size:10px}.layout{grid-template-columns:1fr;gap:28px;min-height:0}main{padding-top:30px}h1{font-size:48px}.english{margin-bottom:16px}.desc{max-width:none}.stage{height:62vh;min-height:390px;max-height:650px;grid-row:2}.controls{margin-top:22px}.meta{margin-top:25px}footer{flex-direction:column;gap:8px}.chip{margin-top:8px}}
</style>
</head>
<body>
<header><div class="brand"><span>ϟ</span>模型展厅</div><div class="tag">3D CHARACTER COLLECTION / 001</div></header>
<main><div class="layout"><section><div class="eyebrow">电气鼠 · 3D 角色模型</div><h1>皮卡丘</h1><p class="english">PIKACHU</p><p class="desc">黄色的身影，红红的脸颊，还有标志性的闪电尾巴。拖动模型，从每一个角度看看它。</p><div class="chip">ϟ 电属性</div><div class="controls"><button id="rotate" class="active" aria-pressed="true">暂停旋转</button><button id="reset">重置视角</button><button id="fullscreen">全屏查看</button></div><div class="secondary"><a class="download" href="assets/pikachu.glb" download>↓ 下载 3D 模型</a><a class="download" href="assets/pikachu.blend" download>↓ Blender 源文件</a><a class="download" href="assets/pikachu.png" download>↓ 渲染截图</a></div><div class="meta"><div>模型数量<strong>01</strong></div><div>文件格式<strong>GLB / Blender</strong></div><div>浏览方式<strong>360° 交互</strong></div></div></section><div class="stage" id="stage"><div class="stage-label">INTERACTIVE 3D PREVIEW</div><model-viewer id="viewer" src="assets/pikachu.glb" poster="assets/pikachu.png" alt="皮卡丘三维模型：黄色身体、黑色耳尖、红色脸颊和闪电尾巴" camera-controls auto-rotate rotation-per-second="15deg" auto-rotate-delay="1800" camera-orbit="22deg 72deg auto" field-of-view="32deg" min-camera-orbit="auto 15deg auto" max-camera-orbit="auto 110deg auto" shadow-intensity="1.2" shadow-softness="1" exposure="1.15" environment-image="neutral" interaction-prompt="none" touch-action="pan-y"></model-viewer><div class="status" id="status" role="status">正在加载 3D 模型…</div><div class="hint">拖动旋转 · 滚轮缩放 · 手机双指缩放</div></div></div><footer><span>皮卡丘 · 3D 模型展厅</span><span>在浏览器里，发现模型的每一面。</span></footer></main>
<script>
const viewer=document.getElementById('viewer'),rotate=document.getElementById('rotate'),status=document.getElementById('status');
viewer.addEventListener('load',()=>status.hidden=true);
viewer.addEventListener('error',()=>{status.className='status error';status.textContent='3D 模型加载失败。你仍可查看渲染截图，或下载模型文件。'});
rotate.addEventListener('click',()=>{viewer.autoRotate=!viewer.autoRotate;rotate.textContent=viewer.autoRotate?'暂停旋转':'自动旋转';rotate.classList.toggle('active',viewer.autoRotate);rotate.setAttribute('aria-pressed',String(viewer.autoRotate))});
document.getElementById('reset').addEventListener('click',()=>{viewer.cameraOrbit='22deg 72deg auto';viewer.fieldOfView='32deg';viewer.resetTurntableRotation(0);viewer.jumpCameraToGoal()});
const fs=document.getElementById('fullscreen');if(!document.getElementById('stage').requestFullscreen)fs.hidden=true;fs.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.getElementById('stage').requestFullscreen()}catch(e){status.hidden=false;status.textContent='当前浏览器不支持全屏，请使用横屏查看。'}});
</script>
</body></html>
